name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'hexo-preview/**'
      - 'datasets/**'
      - 'models/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            hexo-preview/package-lock.json
      - name: Install Docusaurus dependencies
        working-directory: website
        run: npm ci
      - name: Build current Docusaurus site
        working-directory: website
        run: npm run build
      - name: Install Hexo preview dependencies
        working-directory: hexo-preview
        run: npm ci
      - name: Build Hexo and Butterfly preview
        working-directory: hexo-preview
        run: npm run build
      - name: Add preview beside current site
        run: |
          mkdir -p website/build/hexo-preview
          cp -a hexo-preview/public/. website/build/hexo-preview/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
